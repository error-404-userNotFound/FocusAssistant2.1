[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "focusassistant2"
version = "2.1.0"
description = "Extension-free macOS focus sessions, rewritten in Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Focus Assistant contributors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
]
requires-python = ">=3.11"
dependencies = [
    "PyAutoGUI>=0.9.54; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices; sys_platform == 'darwin'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.16,<7", "build>=1.2,<2"]

[project.scripts]
focusassistant = "focusassistant.__main__:main"
focusassistant2 = "focusassistant.__main__:main"

[tool.setuptools.package-data]
focusassistant = ["*.js"]

[tool.setuptools.packages.find]
include = ["focusassistant*"]
