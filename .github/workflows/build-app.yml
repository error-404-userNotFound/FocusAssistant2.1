name: Build macOS apps (manual)
on:
  workflow_dispatch:
    inputs:
      target:
        description: Architecture to build
        type: choice
        options: [both, apple-silicon, intel]
        default: both
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.inputs.target == 'intel' && '["macos-15-intel"]' || github.event.inputs.target == 'apple-silicon' && '["macos-15"]' || '["macos-15","macos-15-intel"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build native app and zip
        run: /bin/zsh 'Build macOS App.command'
      - uses: actions/upload-artifact@v4
        with:
          name: FocusAssistant-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
